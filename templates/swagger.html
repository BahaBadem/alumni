{% load static %}
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alumni Portal | Swagger API Dokümantasyonu</title>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css">
    <link rel="stylesheet" href="{% static 'portal/interior.css' %}">
</head>
<body class="page-swagger">
    {% include "partials/portal_header.html" %}

    <main id="main" class="workspace" tabindex="-1">
        <section class="page-banner">
            <div>
                <h1>Swagger API Docs</h1>
                <p>API uç noktalarını incele ve örnek istek gönder.</p>
            </div>
            <div class="actions">
                <a href="{% url 'swagger_json' %}" class="btn-secondary">OpenAPI şemasını aç ↗</a>
                <a href="{% url 'health_check' %}" class="btn-secondary">API durumunu kontrol et ↗</a>
            </div>
        </section>
        <div id="swagger-ui"></div>
    </main>

    {% include "partials/portal_footer.html" %}

    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-standalone-preset.js"></script>
    <script>
        window.onload = function() {
            window.ui = SwaggerUIBundle({
                url: "/api/swagger.json",
                dom_id: '#swagger-ui',
                deepLinking: true,
                presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIStandalonePreset
                ],
                layout: "BaseLayout"
            });
        };
    </script>
</body>
</html>
